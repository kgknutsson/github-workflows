name: Azure Web App zip deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment for approval gates and environment-scoped Azure OIDC secrets.
        type: string
        required: true
      webapp-name:
        description: Azure Web App name.
        type: string
        required: true
      resource-group:
        description: Resource group containing the web app.
        type: string
        required: true
      deployment-slot:
        description: Target deployment slot (use production for direct deploy).
        type: string
        required: false
        default: production
      package-artifact-name:
        description: Workflow artifact name uploaded by the caller build job.
        type: string
        required: true
      package-artifact-filename:
        description: Zip file name inside the downloaded artifact directory.
        type: string
        required: false
        default: app.zip
      health-check-url:
        description: Full health URL. When empty, uses the slot hostname plus health-check-path.
        type: string
        required: false
        default: ''
      health-check-path:
        description: Health path when health-check-url is empty.
        type: string
        required: false
        default: /health
      expected-http-status:
        description: HTTP status code that indicates a healthy response.
        type: string
        required: false
        default: '200'
      health-max-wait-seconds:
        type: number
        required: false
        default: 300
      poll-interval-seconds:
        type: number
        required: false
        default: 10
      runner:
        description: Runner label (use azure-linux-runner when the app is private).
        type: string
        required: false
        default: azure-linux-runner
    secrets:
      CLIENT_ID:
        required: true
      TENANT_ID:
        required: true
      SUBSCRIPTION_ID:
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.webapp-name }}
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Download deployment package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package-artifact-name }}
          path: .webapp-package

      - name: Deploy package to production slot
        if: inputs.deployment-slot == 'production'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.webapp-name }}
          package: .webapp-package/${{ inputs.package-artifact-filename }}

      - name: Deploy package to named deployment slot
        if: inputs.deployment-slot != 'production'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.webapp-name }}
          slot-name: ${{ inputs.deployment-slot }}
          package: .webapp-package/${{ inputs.package-artifact-filename }}

      - name: Verify deployment health
        shell: bash
        env:
          WEBAPP_NAME: ${{ inputs.webapp-name }}
          RESOURCE_GROUP: ${{ inputs.resource-group }}
          DEPLOYMENT_SLOT: ${{ inputs.deployment-slot }}
          HEALTH_CHECK_URL: ${{ inputs.health-check-url }}
          HEALTH_CHECK_PATH: ${{ inputs.health-check-path }}
          EXPECTED_HTTP_STATUS: ${{ inputs.expected-http-status }}
          HEALTH_MAX_WAIT_SECONDS: ${{ inputs.health-max-wait-seconds }}
          POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
        run: |
          set -euo pipefail
          if [[ -n "$HEALTH_CHECK_URL" ]]; then
            URL="$HEALTH_CHECK_URL"
          else
            if [[ "$DEPLOYMENT_SLOT" == "production" ]]; then
              HOST="$(az webapp show --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostName -o tsv)"
            else
              HOST="$(az webapp show --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --slot "$DEPLOYMENT_SLOT" --query defaultHostName -o tsv)"
            fi
            PATH_PART="$HEALTH_CHECK_PATH"
            PATH_PART="/${PATH_PART#/}"
            URL="https://${HOST}${PATH_PART}"
          fi
          ATTEMPTS=$(( (HEALTH_MAX_WAIT_SECONDS + POLL_INTERVAL_SECONDS - 1) / POLL_INTERVAL_SECONDS ))
          echo "Waiting for deployment health: $URL (up to ${ATTEMPTS} attempts)"
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
            if [[ "$STATUS" == "$EXPECTED_HTTP_STATUS" ]]; then
              echo "Health check passed (HTTP $STATUS) on attempt $i/${ATTEMPTS}"
              exit 0
            fi
            if [[ "$i" -lt "$ATTEMPTS" ]]; then
              echo "Attempt $i/${ATTEMPTS}: HTTP $STATUS — retrying in ${POLL_INTERVAL_SECONDS}s..."
              sleep "$POLL_INTERVAL_SECONDS"
            else
              echo "Attempt $i/${ATTEMPTS}: HTTP $STATUS"
            fi
          done
          echo "::error::Health check failed for $URL"
          exit 1
