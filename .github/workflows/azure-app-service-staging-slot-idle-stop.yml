# Stop one staging slot when it is still running.
# The caller owns on.schedule.
# This job does not join the deploy concurrency group.
# A shared group would cancel a deploy that is waiting in that group.
# The stop takes a web app tag lock, checks again, and then stops the slot.
# A deploy that uses the same lock cannot change the slot during that stop.
# The stop skips when a named deploy workflow is queued or in progress.

name: Azure App Service staging slot idle stop

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment for OIDC secrets.
        type: string
        required: true
      webapp-name:
        description: Azure Web App name. When empty, the job uses the AZURE_WEBAPP_NAME secret.
        type: string
        required: false
        default: ''
      resource-group:
        description: Resource group containing the web app. When empty, the job looks up the group from the web app name.
        type: string
        required: false
        default: ''
      staging-slot:
        description: Slot to stop when it is running.
        type: string
        required: false
        default: staging
      concurrency-group:
        description: >-
          Key for this stop only. The job prefixes it and does not use the deploy group.
          Two stops for the same key wait. A deploy in another group is left in place.
        type: string
        required: true
      deploy-workflows:
        description: >-
          Comma-separated workflow file names, for example deploy-app.yml.
          The stop skips when one of those workflows is queued or in progress.
        type: string
        required: true
      scripts-ref:
        description: Git ref of kgknutsson/github-workflows that contains the slot script.
        type: string
        required: false
        default: v4
      runner:
        description: Runner label.
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      CLIENT_ID:
        required: false
      TENANT_ID:
        required: false
      SUBSCRIPTION_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      AZURE_WEBAPP_NAME:
        required: false

jobs:
  stop:
    name: Stop ${{ inputs.webapp-name }}/${{ inputs.staging-slot }}
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: staging-slot-idle-stop-${{ inputs.concurrency-group }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Skip when a deploy is queued or running
        id: busy
        shell: bash
        env:
          DEPLOY_WORKFLOWS: ${{ inputs.deploy-workflows }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_WORKFLOWS" ]; then
            echo "::error::Set deploy-workflows so the stop can see an active deploy."
            exit 1
          fi
          IFS=',' read -ra files <<< "$DEPLOY_WORKFLOWS"
          for raw in "${files[@]}"; do
            file="${raw#"${raw%%[![:space:]]*}"}"
            file="${file%"${file##*[![:space:]]}"}"
            [ -n "$file" ] || continue
            for status in queued in_progress waiting requested pending; do
              count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${file}/runs?status=${status}&per_page=1" --jq '.total_count')"
              if [ "${count}" != "0" ]; then
                echo "Skip stop. ${file} has a ${status} run."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout slot script
        if: steps.busy.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kgknutsson/github-workflows
          ref: ${{ inputs.scripts-ref }}
          path: shared-workflows
          sparse-checkout: |
            .github/scripts/azure-app-service-slot-promotion.sh
          sparse-checkout-cone-mode: false

      - name: Login to Azure
        if: steps.busy.outputs.skip != 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource group
        if: steps.busy.outputs.skip != 'true'
        id: target
        shell: bash
        env:
          WEBAPP_NAME: ${{ inputs.webapp-name || secrets.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ inputs.resource-group }}
        run: |
          set -euo pipefail
          if [ -z "$WEBAPP_NAME" ]; then
            echo "::error::Set webapp-name or the AZURE_WEBAPP_NAME secret."
            exit 1
          fi
          if [ -z "$RESOURCE_GROUP" ]; then
            RESOURCE_GROUP="$(az webapp list --query "[?name=='$WEBAPP_NAME'].resourceGroup" -o tsv)"
          fi
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::No web app named $WEBAPP_NAME was found."
            exit 1
          fi
          echo "webapp_name=$WEBAPP_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$RESOURCE_GROUP" >> "$GITHUB_OUTPUT"

      - name: Acquire slot mutation lock
        id: slot_lock
        if: steps.busy.outputs.skip != 'true'
        shell: bash
        env:
          WEBAPP_NAME: ${{ steps.target.outputs.webapp_name }}
          RESOURCE_GROUP: ${{ steps.target.outputs.resource_group }}
          LOCK_WAIT_SECONDS: "30"
        run: |
          set -euo pipefail
          set +e
          bash shared-workflows/.github/scripts/azure-app-service-slot-promotion.sh lock-acquire
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "The slot lock is held. Skip the stop."
            echo "held=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "held=true" >> "$GITHUB_OUTPUT"

      - name: Recheck deploys under the slot lock
        id: busy_locked
        if: steps.busy.outputs.skip != 'true' && steps.slot_lock.outputs.held == 'true'
        shell: bash
        env:
          DEPLOY_WORKFLOWS: ${{ inputs.deploy-workflows }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          bash shared-workflows/.github/scripts/azure-app-service-slot-promotion.sh deploy-busy
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Stop the slot when it is running
        if: steps.busy.outputs.skip != 'true' && steps.slot_lock.outputs.held == 'true' && steps.busy_locked.outputs.skip != 'true'
        shell: bash
        env:
          WEBAPP_NAME: ${{ steps.target.outputs.webapp_name }}
          RESOURCE_GROUP: ${{ steps.target.outputs.resource_group }}
          STAGING_SLOT: ${{ inputs.staging-slot }}
        run: bash shared-workflows/.github/scripts/azure-app-service-slot-promotion.sh slot-stop

      - name: Release slot mutation lock
        if: always() && steps.slot_lock.outputs.held == 'true'
        shell: bash
        env:
          WEBAPP_NAME: ${{ steps.target.outputs.webapp_name }}
          RESOURCE_GROUP: ${{ steps.target.outputs.resource_group }}
        run: bash shared-workflows/.github/scripts/azure-app-service-slot-promotion.sh lock-release
