name: Validate workflow syntax

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color .github/workflows/azure-app-service-slot-promotion.yml

  promotion-script-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify promotion script passes bash -n
        run: bash -n .github/scripts/azure-app-service-slot-promotion.sh
