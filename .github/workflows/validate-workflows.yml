name: Validate workflow syntax

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color \
            .github/workflows/azure-app-service-slot-promotion.yml \
            .github/workflows/azure-app-service-slot-swap-recovery-preflight.yml \
            .github/workflows/spa-app-service-pr-preview.yml \
            .github/workflows/spa-app-service-pr-preview-cleanup.yml \
            .github/workflows/spa-app-service-pr-preview-orphan-cleanup.yml

  promotion-script-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify promotion and guard scripts pass bash -n
        run: |
          bash -n .github/scripts/azure-app-service-slot-promotion.sh
          bash -n .github/scripts/azure-app-service-slot-swap-guards.sh
          bash -n .github/scripts/spa-app-service-wait-for-scm.sh
          bash -n .github/scripts/spa-app-service-zip-deploy-retry.sh
          bash -n .github/scripts/spa-app-service-verify-slot-http.sh
          bash -n .github/scripts/spa-app-service-write-failure-summary.sh
