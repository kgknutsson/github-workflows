name: Deploy

on:
  workflow_call:
    inputs:
      application:
        type: string
        required: false
      environment:
        type: string
        required: true
      tf_environment:
        type: string
        required: false
      flyway_script_locations:
        type: string
        required: false
      slot-name:
        type: string
        required: false
        default: production
      slot-name2:
        type: string
        required: false
      package:
        type: string
        required: false
        default: 'app-package/*.[j,w]ar'
      target-path:
        type: string
        required: false
      deploy-function:
        type: boolean
        required: false
        default: true
      explicit_slot_swap:
        type: boolean
        required: false
        default: false
      health_check_path:
        type: string
        required: false
        default: /actuator/health
      staging_health_attempts:
        type: number
        required: false
        default: 30
      production_health_attempts:
        type: number
        required: false
        default: 10
      manage_deploy_slot_lifecycle:
        type: boolean
        required: false
        default: false
        description: >-
          When true with explicit_slot_swap, start the deploy slot (slot-name) before
          package deploy and stop it after production health checks pass, to free App
          Service plan memory between releases.

jobs:
  terraform:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Apply Terraform configuration
        uses: kgknutsson/github-actions/gitops-apply-terraform@v3
        with:
          client_id: ${{ secrets.CLIENT_ID }}
          subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.TENANT_ID }}
          tf_storage_account: ${{ secrets.TF_STORAGE_ACCOUNT }}
          environment: ${{ inputs.tf_environment != '' && inputs.tf_environment || inputs.environment }}

  deploy:
    needs: [terraform]
    runs-on: ${{ inputs.explicit_slot_swap && 'azure-linux-runner' || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
      - name: Download Terraform output data
        uses: actions/download-artifact@v8
        with:
          name: terraform-output
      - name: Set environment variables
        run: |
          echo "APPLICATION_CAF_NAME=$(cat terraform-output.json | jq -r '.application_caf_name.value | select(. != null)')" >> $GITHUB_ENV
          echo "FUNCTION_CAF_NAME=$(cat terraform-output.json | jq -r '.function_caf_name.value | select(. != null)')" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=$(cat terraform-output.json | jq -r '.resource_group_name.value | select(. != null)')" >> $GITHUB_ENV
      - name: Validate explicit slot swap inputs
        if: env.APPLICATION_CAF_NAME != '' && inputs.explicit_slot_swap
        env:
          SLOT_NAME: ${{ inputs.slot-name }}
          SECONDARY_SLOT_NAME: ${{ inputs.slot-name2 }}
          STAGING_HEALTH_ATTEMPTS: ${{ inputs.staging_health_attempts }}
          PRODUCTION_HEALTH_ATTEMPTS: ${{ inputs.production_health_attempts }}
        run: |
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::terraform output is missing resource_group_name"
            exit 1
          fi
          if ! [[ "$STAGING_HEALTH_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::staging_health_attempts must be a positive integer"
            exit 1
          fi
          if ! [[ "$PRODUCTION_HEALTH_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::production_health_attempts must be a positive integer"
            exit 1
          fi
          if [ -z "$SLOT_NAME" ] || [ "$SLOT_NAME" = "production" ]; then
            echo "::error::explicit_slot_swap requires slot-name to be set to a non-production slot"
            exit 1
          fi
          if [ "$SECONDARY_SLOT_NAME" = "production" ]; then
            echo "::error::explicit_slot_swap cannot be combined with slot-name2: production"
            exit 1
          fi
      - name: Validate deploy slot lifecycle inputs
        if: env.APPLICATION_CAF_NAME != '' && inputs.manage_deploy_slot_lifecycle
        env:
          SLOT_NAME: ${{ inputs.slot-name }}
        run: |
          if [ "${{ inputs.explicit_slot_swap }}" != "true" ]; then
            echo "::error::manage_deploy_slot_lifecycle requires explicit_slot_swap: true"
            exit 1
          fi
          if [ -z "$SLOT_NAME" ] || [ "$SLOT_NAME" = "production" ]; then
            echo "::error::manage_deploy_slot_lifecycle requires slot-name to be a non-production deployment slot"
            exit 1
          fi
      - name: Start deploy slot before package deploy
        if: env.APPLICATION_CAF_NAME != '' && inputs.manage_deploy_slot_lifecycle && inputs.explicit_slot_swap && inputs.slot-name != 'production'
        env:
          SLOT_NAME: ${{ inputs.slot-name }}
        run: |
          set -eo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if ! slot_state=$(az webapp show --name "$APPLICATION_CAF_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" --query state -o tsv 2>"$error_file"); then
            echo "::error::Failed to query slot '$SLOT_NAME' state for app '$APPLICATION_CAF_NAME'"
            cat "$error_file"
            exit 1
          fi
          if [ "$slot_state" = "Running" ]; then
            echo "Deploy slot '$SLOT_NAME' is already Running"
            exit 0
          fi

          echo "Starting deploy slot '$SLOT_NAME' (zip deploy does not start a stopped slot on its own)"
          if ! az webapp start --name "$APPLICATION_CAF_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" 2>"$error_file"; then
            echo "::error::Failed to start slot '$SLOT_NAME' for app '$APPLICATION_CAF_NAME'"
            cat "$error_file"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if ! slot_state=$(az webapp show --name "$APPLICATION_CAF_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" --query state -o tsv 2>"$error_file"); then
              echo "::error::Failed to query slot '$SLOT_NAME' state after the start request"
              cat "$error_file"
              exit 1
            fi
            if [ "$slot_state" = "Running" ]; then
              echo "Deploy slot '$SLOT_NAME' started successfully"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deploy slot '$SLOT_NAME' did not reach Running state after the start request"
          exit 1
      - name: Download application package
        if: env.APPLICATION_CAF_NAME != ''
        uses: actions/download-artifact@v8
        with:
          name: package
          path: app-package
      - name: Deploy to Azure App Service
        if: env.APPLICATION_CAF_NAME != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APPLICATION_CAF_NAME }}
          slot-name: ${{ inputs.slot-name }}
          package: ${{ inputs.package }}
          target-path: ${{ inputs.target-path }}
      - name: Verify staging slot health
        if: env.APPLICATION_CAF_NAME != '' && inputs.explicit_slot_swap && inputs.slot-name != 'production'
        env:
          HEALTH_CHECK_PATH: ${{ inputs.health_check_path }}
          SLOT_NAME: ${{ inputs.slot-name }}
          STAGING_HEALTH_ATTEMPTS: ${{ inputs.staging_health_attempts }}
        run: |
          set -eo pipefail
          HEALTH_PATH="$HEALTH_CHECK_PATH"
          HEALTH_PATH="/${HEALTH_PATH#/}"
          URL="https://${APPLICATION_CAF_NAME}-${SLOT_NAME}.azurewebsites.net${HEALTH_PATH}"
          ATTEMPTS="$STAGING_HEALTH_ATTEMPTS"

          echo "Waiting for staging slot to become healthy: $URL"
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 10 "$URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Staging health check passed (HTTP $STATUS) on attempt $i/$ATTEMPTS"
              exit 0
            fi

            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "Attempt $i/$ATTEMPTS: HTTP $STATUS - retrying in 10s..."
              sleep 10
            else
              echo "Attempt $i/$ATTEMPTS: HTTP $STATUS"
            fi
          done

          echo "::error::Staging health check failed after $ATTEMPTS attempts - aborting swap"
          exit 1
      - name: Swap staging to production
        if: env.APPLICATION_CAF_NAME != '' && inputs.explicit_slot_swap && inputs.slot-name != 'production'
        env:
          SLOT_NAME: ${{ inputs.slot-name }}
        run: |
          set -eo pipefail
          az webapp deployment slot swap \
            --name "$APPLICATION_CAF_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot "$SLOT_NAME" \
            --target-slot production
          echo "SWAP_COMPLETED=true" >> "$GITHUB_ENV"
      - name: Verify production health
        if: env.APPLICATION_CAF_NAME != '' && inputs.explicit_slot_swap && inputs.slot-name != 'production'
        env:
          HEALTH_CHECK_PATH: ${{ inputs.health_check_path }}
          PRODUCTION_HEALTH_ATTEMPTS: ${{ inputs.production_health_attempts }}
        run: |
          set -eo pipefail
          HEALTH_PATH="$HEALTH_CHECK_PATH"
          HEALTH_PATH="/${HEALTH_PATH#/}"
          URL="https://${APPLICATION_CAF_NAME}.azurewebsites.net${HEALTH_PATH}"
          ATTEMPTS="$PRODUCTION_HEALTH_ATTEMPTS"

          echo "Verifying production after slot swap: $URL"
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 10 "$URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Production health check passed (HTTP $STATUS) on attempt $i/$ATTEMPTS"
              echo "PRODUCTION_HEALTH_PASSED=true" >> "$GITHUB_ENV"
              exit 0
            fi

            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "Attempt $i/$ATTEMPTS: HTTP $STATUS - retrying in 10s..."
              sleep 10
            else
              echo "Attempt $i/$ATTEMPTS: HTTP $STATUS"
            fi
          done

          echo "::error::Production health check failed after $ATTEMPTS attempts"
          exit 1
      - name: Stop deploy slot after successful promotion
        if: env.APPLICATION_CAF_NAME != '' && inputs.manage_deploy_slot_lifecycle && env.PRODUCTION_HEALTH_PASSED == 'true'
        env:
          SLOT_NAME: ${{ inputs.slot-name }}
        run: |
          set -eo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if ! slot_state=$(az webapp show --name "$APPLICATION_CAF_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" --query state -o tsv 2>"$error_file"); then
            echo "::error::Failed to query slot '$SLOT_NAME' state for app '$APPLICATION_CAF_NAME'"
            cat "$error_file"
            exit 1
          fi
          if [ "$slot_state" = "Stopped" ]; then
            echo "Deploy slot '$SLOT_NAME' is already Stopped"
            exit 0
          fi

          echo "Stopping deploy slot '$SLOT_NAME' to free App Service plan memory until the next release"
          if ! az webapp stop --name "$APPLICATION_CAF_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" 2>"$error_file"; then
            echo "::error::Failed to stop slot '$SLOT_NAME' for app '$APPLICATION_CAF_NAME'"
            cat "$error_file"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if ! slot_state=$(az webapp show --name "$APPLICATION_CAF_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" --query state -o tsv 2>"$error_file"); then
              echo "::error::Failed to query slot '$SLOT_NAME' state after the stop request"
              cat "$error_file"
              exit 1
            fi
            if [ "$slot_state" = "Stopped" ]; then
              echo "Deploy slot '$SLOT_NAME' stopped successfully"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deploy slot '$SLOT_NAME' did not reach Stopped state after the stop request"
          exit 1
      - name: Roll back failed slot swap
        if: failure() && env.SWAP_COMPLETED == 'true' && env.PRODUCTION_HEALTH_PASSED != 'true'
        env:
          SLOT_NAME: ${{ inputs.slot-name }}
        run: |
          set -eo pipefail
          echo "Rolling back by swapping the staging slot back to production..."
          az webapp deployment slot swap \
            --name "$APPLICATION_CAF_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot "$SLOT_NAME" \
            --target-slot production
          echo "ROLLBACK_COMPLETED=true" >> "$GITHUB_ENV"
      - name: Verify rollback health
        if: failure() && env.ROLLBACK_COMPLETED == 'true'
        env:
          HEALTH_CHECK_PATH: ${{ inputs.health_check_path }}
        run: |
          set -eo pipefail
          HEALTH_PATH="$HEALTH_CHECK_PATH"
          HEALTH_PATH="/${HEALTH_PATH#/}"
          URL="https://${APPLICATION_CAF_NAME}.azurewebsites.net${HEALTH_PATH}"

          echo "Pinging production after rollback: $URL"
          for i in $(seq 1 5); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 10 "$URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Rollback health check passed (HTTP $STATUS) on attempt $i/5"
              exit 0
            fi

            if [ "$i" -lt 5 ]; then
              echo "Attempt $i/5: HTTP $STATUS - retrying in 10s..."
              sleep 10
            else
              echo "Attempt $i/5: HTTP $STATUS"
            fi
          done

          echo "::warning::Rollback health check did not pass - manual verification is required"
      - name: Deploy to Azure App Service
        if: env.APPLICATION_CAF_NAME != '' && inputs.slot-name2 != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APPLICATION_CAF_NAME }}
          slot-name: ${{ inputs.slot-name2 }}
          package: ${{ inputs.package }}
          target-path: ${{ inputs.target-path }}
      - name: Download function package
        if: inputs.deploy-function && env.FUNCTION_CAF_NAME != ''
        uses: actions/download-artifact@v8
        with:
          name: function-package
          path: function-package
      - name: Deploy to Azure Function
        if: inputs.deploy-function && env.FUNCTION_CAF_NAME != ''
        uses: azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_CAF_NAME }}
          package: function-package
  
  flyway:
    needs: [terraform]
    if: inputs.flyway_script_locations != ''
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download Terraform output data
        uses: actions/download-artifact@v8
        with:
          name: terraform-output
      - name: Set environment variables
        run: echo "FLYWAY_URL=$(cat terraform-output.json | jq -r .database_jdbc_string.value)" >> $GITHUB_ENV
      - name: Run flyway migrate
        uses: docker://flyway/flyway:9.19
        env:
          FLYWAY_LOCATIONS: 'filesystem:./${{ inputs.flyway_script_locations }}'
        with:
          args: migrate
  