# Callable: delete pr-<number> slots on shared dev web apps (nightly plan memory relief).
name: SPA App Service PR preview nightly stop

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment for Azure OIDC
        type: string
        required: true
      resource_group:
        type: string
        required: true
      webapp_names_json:
        description: JSON array of App Service names to scan for pr-* slots
        type: string
        required: true
      scripts_ref:
        description: Git ref in kgknutsson/github-workflows used to fetch helper scripts
        type: string
        required: false
        default: dev
      caller_pre_delete_script:
        description: Optional script in the caller repo before each slot is deleted
        type: string
        required: false
        default: ""
      caller_pre_delete_env_json:
        description: JSON object exported before caller_pre_delete_script runs
        type: string
        required: false
        default: "{}"
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      ENTRA_APP_ID:
        description: Optional Entra app id. When set, remove redirect URIs for deleted previews
        required: false
    outputs:
      stopped_pr_numbers:
        description: Space-separated PR numbers whose preview slots were deleted in this run
        value: ${{ jobs.stop.outputs.stopped_pr_numbers }}
      stopped_at_utc:
        description: UTC timestamp when the delete pass finished
        value: ${{ jobs.stop.outputs.stopped_at_utc }}

jobs:
  stop:
    name: Delete PR preview slots
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      stopped_pr_numbers: ${{ steps.stop.outputs.stopped_pr_numbers }}
      stopped_at_utc: ${{ steps.stop.outputs.stopped_at_utc }}
    steps:
      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # tag: v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Checkout caller repository
        if: inputs.caller_pre_delete_script != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7

      - name: Export caller pre-delete environment
        if: inputs.caller_pre_delete_script != ''
        shell: bash
        env:
          CALLER_PRE_DELETE_ENV_JSON: ${{ inputs.caller_pre_delete_env_json }}
        run: |
          set -euo pipefail
          python3 - "$CALLER_PRE_DELETE_ENV_JSON" "$GITHUB_ENV" <<'PY'
          import json
          import sys
          raw, path = sys.argv[1], sys.argv[2]
          data = json.loads(raw)
          if not isinstance(data, dict):
              raise SystemExit("caller_pre_delete_env_json must be a JSON object")
          with open(path, "a", encoding="utf-8") as handle:
              for key, value in data.items():
                  if not isinstance(key, str) or not key.replace("_", "").isalnum():
                      raise SystemExit(f"unsupported caller pre-delete env name: {key}")
                  text = "" if value is None else str(value)
                  if "\n" in text or "\r" in text:
                      raise SystemExit(f"unsupported caller pre-delete env value: {key}")
                  handle.write(f"{key}={text}\n")
          PY

      - name: Checkout workflow helper scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7
        with:
          repository: kgknutsson/github-workflows
          ref: ${{ inputs.scripts_ref }}
          path: reusable-workflows
          sparse-checkout: |
            .github/scripts/spa-app-service-pr-preview-nightly-stop.sh
          sparse-checkout-cone-mode: false

      - name: Delete pr-* slots
        id: stop
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WEBAPP_NAMES_JSON: ${{ inputs.webapp_names_json }}
          ENTRA_APP_ID: ${{ secrets.ENTRA_APP_ID }}
          CALLER_PRE_DELETE_SCRIPT: ${{ inputs.caller_pre_delete_script }}
        run: bash reusable-workflows/.github/scripts/spa-app-service-pr-preview-nightly-stop.sh
