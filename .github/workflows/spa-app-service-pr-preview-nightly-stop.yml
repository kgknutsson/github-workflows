# Callable: stop Running pr-<number> slots on shared dev web apps (nightly plan memory relief).
name: SPA App Service PR preview nightly stop

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment for Azure OIDC
        type: string
        required: true
      resource_group:
        type: string
        required: true
      webapp_names_json:
        description: JSON array of App Service names to scan for pr-* slots
        type: string
        required: true
      scripts_ref:
        description: Git ref in kgknutsson/github-workflows used to fetch helper scripts
        type: string
        required: false
        default: dev
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
    outputs:
      stopped_pr_numbers:
        description: Space-separated PR numbers whose slots were stopped in this run
        value: ${{ jobs.stop.outputs.stopped_pr_numbers }}
      stopped_at_utc:
        description: UTC timestamp when the stop pass finished
        value: ${{ jobs.stop.outputs.stopped_at_utc }}

jobs:
  stop:
    name: Stop running PR preview slots
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      stopped_pr_numbers: ${{ steps.stop.outputs.stopped_pr_numbers }}
      stopped_at_utc: ${{ steps.stop.outputs.stopped_at_utc }}
    steps:
      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # tag: v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Checkout workflow helper scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7
        with:
          repository: kgknutsson/github-workflows
          ref: ${{ inputs.scripts_ref }}
          path: reusable-workflows
          sparse-checkout: |
            .github/scripts/spa-app-service-pr-preview-nightly-stop.sh
          sparse-checkout-cone-mode: false

      - name: Stop Running pr-* slots
        id: stop
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WEBAPP_NAMES_JSON: ${{ inputs.webapp_names_json }}
        run: bash reusable-workflows/.github/scripts/spa-app-service-pr-preview-nightly-stop.sh
