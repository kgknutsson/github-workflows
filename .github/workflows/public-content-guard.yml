name: Public content guard

on:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7
        with:
          persist-credentials: false

      - name: Scan pushed revision
        env:
          DENYLIST_REQUIRED: "false"
        run: python3 .github/scripts/scan-public-content.py
