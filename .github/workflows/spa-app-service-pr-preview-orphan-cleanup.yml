# Delete pr-* slots whose pull request is not open.
# The caller owns the schedule. This workflow checks one web app.
name: SPA App Service preview orphan cleanup

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      webapp_name:
        type: string
        required: true
      resource_group:
        type: string
        required: true
      slot_prefix:
        type: string
        required: false
        default: pr-
      comment_marker:
        type: string
        required: false
        default: "<!-- pr-preview-webapp -->"
      entra_app_id:
        description: When set, remove redirect URIs for each deleted preview
        type: string
        required: false
        default: ""
      runner:
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      ENTRA_APP_ID:
        description: Optional Entra app id for redirect URI cleanup (prefer over entra_app_id input)
        required: false

jobs:
  orphan-cleanup:
    outputs:
      deleted_prs: ${{ steps.sweep.outputs.deleted_prs }}
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    concurrency:
      group: spa-preview-orphan-${{ inputs.webapp_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    steps:
      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # tag: v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete slots for closed pull requests
        id: sweep
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WEBAPP_NAME: ${{ inputs.webapp_name }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          SLOT_PREFIX: ${{ inputs.slot_prefix }}
          COMMENT_MARKER: ${{ inputs.comment_marker }}
        run: |
          set -euo pipefail
          deleted=""
          if [ "$SLOT_PREFIX" != "pr-" ]; then
            echo "::error::slot_prefix must be pr-."
            exit 1
          fi
          if ! az webapp show --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --query name -o tsv >/dev/null; then
            echo "Web app was not found. Nothing to delete."
            echo "deleted_prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slots=()
          mapfile -t slots < <(az webapp deployment slot list --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --query "[].name" -o tsv)
          for slot in "${slots[@]}"; do
            if ! printf '%s' "$slot" | grep -Eq '^pr-[0-9]+$'; then
              continue
            fi
            pr_number="${slot#pr-}"
            set +e
            state="$(gh pr view "$pr_number" --repo "$REPO" --json state --jq .state 2>"$RUNNER_TEMP/pr-view-error")"
            view_exit=$?
            set -e
            if [ "$view_exit" -ne 0 ]; then
              if grep -qi "Could not resolve" "$RUNNER_TEMP/pr-view-error"; then
                state="MISSING"
              else
                echo "::error::Unable to read pull request ${pr_number}."
                cat "$RUNNER_TEMP/pr-view-error"
                exit 1
              fi
            fi
            if [ "$state" = "OPEN" ]; then
              echo "Pull request ${pr_number} is open. Slot ${slot} stays."
              continue
            fi
            deleted="${deleted} ${pr_number}"
            if [ "$state" != "MISSING" ]; then
            PR_NUMBER="$pr_number" python3 - <<'PY'
          import json
          import os
          import urllib.request
          marker = os.environ["COMMENT_MARKER"]
          repo = os.environ["REPO"]
          number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          def load_comments():
              comments = []
              url = f"https://api.github.com/repos/{repo}/issues/{number}/comments?per_page=100"
              while url:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "User-Agent": "spa-preview-cleanup",
                      },
                  )
                  with urllib.request.urlopen(request) as response:
                      comments.extend(json.load(response))
                      url = None
                      link = response.headers.get("Link") or ""
                      for part in link.split(","):
                          if 'rel="next"' in part:
                              url = part.split(";")[0].strip().strip("<>")
              return comments
          for comment in load_comments():
              if marker not in (comment.get("body") or ""):
                  continue
              delete = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/comments/{comment['id']}",
                  method="DELETE",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                  },
              )
              try:
                  with urllib.request.urlopen(delete):
                      print(f"Deleted comment {comment['id']} on pull request {number}")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"Comment {comment['id']} was already deleted.")
                  else:
                      raise
          PY
            fi
            echo "Deleting slot ${slot}. Pull request state: ${state}."
            az webapp deployment slot delete \
              --name "$WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --slot "$slot"
          done
          echo "deleted_prs=${deleted# }" >> "$GITHUB_OUTPUT"

  entra-redirects:
    needs: orphan-cleanup
    if: always() && needs.orphan-cleanup.result == 'success' && needs.orphan-cleanup.outputs.deleted_prs != ''
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    concurrency:
      group: spa-preview-entra-${{ inputs.entra_app_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # tag: v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remove redirect URIs for deleted previews
        shell: bash
        env:
          ENTRA_APP_ID: ${{ secrets.ENTRA_APP_ID != '' && secrets.ENTRA_APP_ID || inputs.entra_app_id }}
          DELETED_PRS: ${{ needs.orphan-cleanup.outputs.deleted_prs }}
        run: |
          set -euo pipefail
          if [ -z "$ENTRA_APP_ID" ]; then
            echo "No Entra app id configured. Skip redirect URI cleanup."
            exit 0
          fi
          current="$(az ad app show --id "$ENTRA_APP_ID" --query "web.redirectUris" -o json)"
          if [ -z "$current" ] || [ "$current" = "null" ]; then
            current="[]"
          fi
          filtered="$current"
          for pr_number in $DELETED_PRS; do
            filtered="$(printf '%s' "$filtered" | jq -c --arg num "$pr_number" '[.[] | select((contains("pr-" + $num + ".") or contains("pr-" + $num + "/")) | not)]')"
          done
          if [ "$(printf '%s' "$current" | jq -c 'sort')" = "$(printf '%s' "$filtered" | jq -c 'sort')" ]; then
            echo "No matching redirect URIs."
            exit 0
          fi
          if [ "$filtered" = "[]" ]; then
            app_object_id="$(az ad app show --id "$ENTRA_APP_ID" --query id -o tsv)"
            az rest --method PATCH \
              --uri "https://graph.microsoft.com/v1.0/applications/${app_object_id}" \
              --body '{"web":{"redirectUris":[]}}'
          else
            mapfile -t uris < <(printf '%s' "$filtered" | jq -r '.[]')
            az ad app update --id "$ENTRA_APP_ID" --web-redirect-uris "${uris[@]}"
          fi
