# Caller-owned schedule. Once a week, at night (Sunday 02:00 UTC).
# concurrency-group must match the deploy workflow group for that app.
# The reusable job uses cancel-in-progress: false, so the stop waits.
# It does not cancel a deploy that is already running.

name: Staging slot idle stop

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  stop:
    permissions:
      id-token: write
      contents: read
    uses: kgknutsson/github-workflows/.github/workflows/azure-app-service-staging-slot-idle-stop.yml@v4 # internal v4 tag; a commit hash is not required for this dependency
    with:
      environment: prod
      webapp-name: ${{ vars.WEBAPP_NAME }}
      resource-group: ${{ vars.RESOURCE_GROUP }}
      staging-slot: staging
      concurrency-group: deploy-app-prod
      scripts-ref: v4
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
